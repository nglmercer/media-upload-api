<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trigger Alerts Studio | Anime.js Power</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1;
      --secondary: #8b5cf6;
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --glass: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body { 
      font-family: 'Inter', system-ui, sans-serif; 
      background: var(--bg); 
      color: var(--text);
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
    }

    .background-glow {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: -1;
      background: 
        radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.15), transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(139, 92, 246, 0.15), transparent 40%);
    }

    /* Sidebar */
    .sidebar {
      width: 320px;
      height: 100vh;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-right: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      padding: 32px 24px;
      z-index: 100;
      box-shadow: 20px 0 50px rgba(0,0,0,0.3);
    }

    .logo {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 24px;
      background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 40px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo span {
      background: var(--primary);
      color: white;
      -webkit-text-fill-color: white;
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 14px;
    }

    .demo-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-right: 8px;
    }

    .demo-item {
      padding: 14px 18px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .demo-item:hover {
      background: rgba(255,255,255,0.1);
      transform: translateX(5px);
      border-color: var(--primary);
    }

    .demo-item.active {
      background: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
    }

    .demo-item h3 {
      font-size: 14px;
      font-weight: 600;
    }

    .demo-item p {
      font-size: 12px;
      color: var(--text-dim);
    }

    .demo-item.active p {
      color: rgba(255,255,255,0.8);
    }

    /* Main Content */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      position: relative;
    }

    .info-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      padding: 40px;
      border-radius: 24px;
      border: 1px solid var(--glass-border);
      max-width: 600px;
      text-align: center;
    }

    .info-card h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 32px;
      margin-bottom: 16px;
    }

    .info-card p {
      color: var(--text-dim);
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .btn-trigger {
      padding: 16px 32px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 20px 40px rgba(99, 102, 241, 0.3);
      transition: all 0.3s;
    }

    .btn-trigger:hover {
      transform: scale(1.05);
      box-shadow: 0 25px 50px rgba(99, 102, 241, 0.5);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    /* For light DOM alerts */
    trigger-alert {
      z-index: 1000;
    }
    /* Builder Styles */
    .builder-panel {
      position: fixed;
      top: 0; right: -450px;
      width: 450px;
      height: 100vh;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border-left: 1px solid var(--glass-border);
      z-index: 200;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      box-shadow: -20px 0 50px rgba(0,0,0,0.5);
    }
    .builder-panel.open { right: 0; }
    
    .builder-header {
      padding: 24px;
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .builder-content {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .builder-section h4 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
      margin-bottom: 12px;
    }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; margin-bottom: 6px; }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
    }
    .element-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .element-card {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      padding: 12px;
      border-radius: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .element-card .icon {
      width: 32px; height: 32px;
      background: var(--primary);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .builder-footer {
      padding: 24px;
      border-top: 1px solid var(--glass-border);
      display: flex;
      gap: 12px;
    }
    .btn-secondary {
      flex: 1;
      padding: 12px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      color: white;
      cursor: pointer;
    }
    .btn-primary {
      flex: 2;
      padding: 12px;
      background: var(--primary);
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    /* Media Library Modal Integration */
    media-library {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1000;
      display: none;
    }
    media-library.visible { display: block; }
  </style>
  <script type="module" src="./demo.ts"></script>
</head>
<body>
  <div class="background-glow"></div>
  
  <div class="main-studio">
    <!-- Sidebar: Template Control -->
    <aside class="sidebar">
      <div class="logo">Alert <span>STUDIO</span></div>
      
      <div class="builder-section">
        <label>Alert Template</label>
        <select id="templateSelector">
          <option value="follow">User Follow</option>
          <option value="subscription">Subscription</option>
          <option value="donation">Donation / Bits</option>
          <option value="milestone">Milestone Checklist</option>
        </select>
      </div>

      <div class="divider"></div>

      <div id="dynamicFields" class="fields-container">
        <!-- Fields will be injected here -->
      </div>

      <div class="divider"></div>

      <div class="builder-section">
        <h4>Animation & Timing</h4>
        <div class="form-group">
          <label>Entry Animation</label>
          <select id="entryAnim">
            <option value="slide-down">Slide Down</option>
            <option value="slide-up">Slide Up</option>
            <option value="scale">Elastic Zoom</option>
            <option value="fade">Smooth Fade</option>
          </select>
        </div>
        <div class="form-group">
          <label>Total Duration (ms)</label>
          <input type="number" id="alertDuration" value="7000">
        </div>
      </div>

      <div class="sidebar-footer">
        <button class="btn-secondary" id="exportJson">Copy JSON</button>
        <button class="btn-primary" id="launchAlert">Launch Preview</button>
      </div>
    </aside>

    <!-- Main Workspace -->
    <main class="workspace">
      <div class="preview-area" id="previewArea">
        <div class="empty-preview">
          <h2>Live Preview Workspace</h2>
          <p>Configure your template in the sidebar and launch a preview to see it in action.</p>
        </div>
      </div>
    </main>
  </div>

  <media-library id="selector"></media-library>

  <style>
    body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .main-studio { display: flex; height: 100vh; width: 100%; }
    
    .sidebar {
      width: 380px;
      height: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border-right: 1px solid var(--glass-border);
      padding: 32px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      z-index: 100;
    }

    .workspace {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.2);
    }

    .divider { height: 1px; background: var(--glass-border); margin: 24px 0; }
    
    .fields-container { flex: 1; display: flex; flex-direction: column; gap: 16px; }

    .sidebar-footer {
      margin-top: 32px;
      display: flex;
      gap: 12px;
    }

    /* Override previous styles */
    .builder-panel { display: none !important; }
    .info-card { display: none !important; }

    .empty-preview {
      text-align: center;
      opacity: 0.3;
    }
    
    #templateSelector {
      width: 100%; padding: 12px; background: var(--bg); 
      border: 1px solid var(--glass-border); border-radius: 10px;
      color: var(--text-main);
      margin-top: 8px;
    }
  </style>
</body>
</html>
